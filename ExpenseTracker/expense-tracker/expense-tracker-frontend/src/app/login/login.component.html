<div class="container-fluid d-flex flex-column justify-content-center align-items-center vh-100">

  <!-- App Title -->
  <h1 class="app-title mb-1">Expense Tracker</h1>
  <p class="app-subtitle mb-4">
    Track your daily expenses easily
  </p>

  <!-- Login Card -->
  <div class="bg-transparent border-0 shadow-none p-4" style="width: 360px;">

    <!-- Success Alert -->
    <div
      *ngIf="successMessage"
      class="alert alert-success alert-dismissible fade show text-center"
      role="alert"
    >
      {{ successMessage }}
      <button type="button" class="btn-close" (click)="successMessage = ''"></button>
    </div>

    <!-- Error Alert -->
    <div
      *ngIf="message"
      class="alert alert-danger alert-dismissible fade show text-center"
      role="alert"
    >
      {{ message }}
      <button type="button" class="btn-close" (click)="message = ''"></button>
    </div>

    <h3 class="text-center mb-3">Login</h3>

    <div class="mb-3">
      <input
        type="email"
        class="form-control"
        placeholder="Email"
        [(ngModel)]="email"
      />
    </div>

    <div class="mb-3">
      <input
        type="password"
        class="form-control"
        placeholder="Password"
        [(ngModel)]="password"
      />
    </div>

    <button
      type="button"
      class="btn btn-primary w-100 py-2"
      (click)="login()"
      [disabled]="!email || !password"
    >
      Login
    </button>

    <p class="text-center mt-3 mb-0">
      New user? <a routerLink="/register">Register here</a>
    </p>

  </div>
</div>
